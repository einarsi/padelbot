[project]
name = "padelbot"
version = "1.8.0"
description = "An app to simplify the life of managing the Equinor BIL Trondheim padel group"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "configparser>=7.2.0",
    "naco-backend-client",
    "python-dotenv>=1.2.2",
    "spond>=1.2.1",
    "starlette>=1.1.0",
    "types-aiofiles>=25.1.0.20260518",
    "uvicorn>=0.48.0",
]

[tool.uv.sources]
naco-backend-client = { path = "naco-backend-client", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "openapi-python-client>=0.28.4",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
    "types-python-dateutil>=2.9.0.20260518",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "-m 'not live'"
markers = [
    "live: read-only checks against the real Spond and Naco; run with `pytest -m live`",
]
